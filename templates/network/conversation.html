{% extends 'base.html' %}{% block content %}<div class="narrow"><h1>{{chat.title|default:'Чат'}}</h1><div class="card messages">{% for m in chat.messages.all %}<p><b>@{{m.sender.username}}</b> {{m.body}} <small>{{m.created_at|time:'H:i'}}</small></p>{% empty %}<p>Почніть розмову.</p>{% endfor %}</div><form class="inline card" method="post">{% csrf_token %}{{form.body}}<button class="button">Надіслати</button></form></div>{% endblock %}
