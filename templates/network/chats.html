{% extends 'base.html' %}{% block content %}<div class="narrow"><div class="d-flex align-items-center justify-content-between flex-wrap gap-2 mb-2"><h1 class="mb-0"><i class="bi bi-chat-dots" aria-hidden="true"></i> Чати</h1><a class="button btn btn-primary" href="{% url 'conversation_create' %}"><i class="bi bi-plus-lg" aria-hidden="true"></i> Новий чат</a></div>{% for c in conversations %}<a class="card block" href="{% url 'conversation' c.pk %}"><i class="bi bi-chat-left-text" aria-hidden="true"></i> {{c.title|default:'Груповий чат'}} · {{c.participants.count}} учасників</a>{% empty %}<div class="card empty"><i class="bi bi-chat-square-heart" aria-hidden="true"></i>Чатів ще немає. Створіть перший із друзями!</div>{% endfor %}</div>{% endblock %}
