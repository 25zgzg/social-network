{% if m.media_kind == 'youtube' %}<div class="media-embed"><iframe src="{{m.youtube_embed_url}}" title="YouTube відео" allowfullscreen loading="lazy"></iframe></div>{% elif m.media_kind == 'video' %}<video class="media" controls><source src="{{m.media_url}}">Ваш браузер не підтримує відео.</video>{% elif m.media_kind == 'image' %}<img class="media" src="{{m.media_url}}" alt="Вкладення">{% elif m.media_url %}<a href="{{m.media_url}}" target="_blank" rel="noopener">Відкрити медіа</a>{% endif %}
