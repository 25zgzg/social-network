{% extends 'base.html' %}{% block content %}<div class="narrow"><h1><i class="bi bi-bell" aria-hidden="true"></i> Сповіщення</h1><p><a href="{% url 'notification_settings' %}"><i class="bi bi-gear" aria-hidden="true"></i> Налаштування сповіщень</a></p>{% for n in items %}<div class="card d-flex align-items-center flex-wrap gap-2"><b>@{{n.actor.username}}</b> {{n.text}}<small>{{n.created_at|timesince}} тому</small></div>{% empty %}<div class="card empty"><i class="bi bi-bell-slash" aria-hidden="true"></i>Нових сповіщень немає.</div>{% endfor %}</div>{% endblock %}
