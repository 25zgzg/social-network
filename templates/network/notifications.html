{% extends 'base.html' %}{% block content %}<div class="narrow"><h1>Сповіщення</h1><p><a href="{% url 'notification_settings' %}">Налаштування сповіщень</a></p>{% for n in items %}<div class="card"><b>@{{n.actor.username}}</b> {{n.text}}<small>{{n.created_at|timesince}} тому</small></div>{% empty %}<div class="card">Нових сповіщень немає.</div>{% endfor %}</div>{% endblock %}
