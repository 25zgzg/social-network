{% load static %}<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}UASocial{% endblock %}</title><link rel="stylesheet" href="{% static 'css/app.css' %}"></head><body><header><nav><a class="brand" href="/">UASocial</a><div class="navlinks">{% if user.is_authenticated %}<a href="{% url 'feed' %}">Стрічка</a><a href="{% url 'friends' %}">Друзі</a><a href="{% url 'chats' %}">Чати</a><a href="{% url 'notifications' %}">Сповіщення</a><a href="{% url 'profile' user.username %}">@{{user.username}}</a><form action="{% url 'account_logout' %}" method="post">{% csrf_token %}<button class="link">Вийти</button></form>{% else %}<a href="{% url 'account_login' %}">Увійти</a><a class="button" href="{% url 'signup' %}">Реєстрація</a>{% endif %}</div></nav></header><main>{% block content %}{% endblock %}</main><footer>UASocial · навчальний Django-проєкт</footer></body></html>
